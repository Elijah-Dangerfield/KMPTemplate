# CI for the TEMPLATE repository itself. Generated projects never receive this
# file (the init script skips the root .github/ dir); they get their workflows
# from template/ci/ instead.
#
# No path filters on purpose: this repo IS the artifact, so every change must
# keep both the template build and the generated-project smoke test green.
name: Template CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm-tests:
    name: JVM tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: De-branding grep
        # Source-app branding must never land in template code. The port queue,
        # the port plans and the history docs legitimately name the app a system
        # was backported from — that attribution is the point of those files —
        # and the two greppers plus this step contain the search term itself.
        # Allowlist by path, not basename: a same-named file elsewhere in the
        # tree should still be caught.
        run: |
          # BSD grep strips the leading ./ that GNU grep emits, so anchor on both.
          P='^(\./)?'
          ALLOW="${P}docs/(decisions|backend-and-supabase-auth-plan|cards-backport-plan|template-upgrade-execution-plan|template-maintenance|PORT-CANDIDATES)\.md:|${P}docs/plans/|${P}scripts/(verify_template\.sh|init_project\.main\.kts):|${P}\.github/workflows/template-ci\.yml:"
          if grep -rIiE --exclude-dir=.git \
               'downcard|warm-felt|\bcards\b' . | grep -vE "$ALLOW"; then
            echo "::error::Source-app branding found in template sources (see matches above)"
            exit 1
          fi

      - name: Install actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/local/bin >/dev/null
          actionlint -version

      - name: Lint template-repo workflows
        run: actionlint .github/workflows/*.yml

      - name: Lint staged (generated-project) workflows
        run: actionlint template/ci/.github/workflows/*.yml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run server tests (testcontainers)
        run: ./gradlew :apps:server:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  ios-compile:
    name: iOS compile
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select runner's default Xcode
        run: |
          if [ ! -d /Applications/Xcode.app ]; then
            echo "::error::/Applications/Xcode.app is missing on runner"
            find /Applications -maxdepth 1 -iname '*xcode*' || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Compile iOS Kotlin target
        run: ./gradlew :apps:compose:compileKotlinIosSimulatorArm64

      - name: Build Xcode project (no codesign)
        run: |
          xcodebuild -project apps/ios/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO

  generated-smoke:
    name: Generated-project smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kotlin CLI
        run: |
          sudo snap install kotlin --classic
          kotlin -version

      - name: Install actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/local/bin >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run generated-project smoke test
        env:
          VERIFY_INCLUDE_SERVER_TESTS: "1"
        run: scripts/verify_template.sh --fast
